<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-label="Gym at Vela by Svasti">
  <title>Gym — strength, light and steel</title>
  <defs>
    <linearGradient id="gym-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14110e"/>
      <stop offset="55%" stop-color="#201a14"/>
      <stop offset="100%" stop-color="#2c2116"/>
    </linearGradient>
    <linearGradient id="gym-beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8d5b0" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gym-plate" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0%" stop-color="#6d5940"/>
      <stop offset="55%" stop-color="#3c3125"/>
      <stop offset="100%" stop-color="#1d1812"/>
    </radialGradient>
    <linearGradient id="gym-iron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a3d2e"/>
      <stop offset="100%" stop-color="#221b14"/>
    </linearGradient>
    <linearGradient id="gym-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d9b26f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d9b26f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gym-grid" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="1400" height="1050" fill="url(#gym-bg)"/>
